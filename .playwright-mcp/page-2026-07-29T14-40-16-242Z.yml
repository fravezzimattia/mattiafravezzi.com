              - heading "About this app" [level=2] [ref=e186]
              - button "See more information on About this app" [ref=e188] [cursor=pointer]:
                - generic [ref=e189]: arrow_forward
            - generic [ref=e190]:
              - generic [ref=e191]: "Mountain Maps is the hiking app that goes with you into the mountains in every season: discover trails, plan your route, navigate with GPS and analyse every path before you set off.Made for anyone who loves walking in the mountains — from your first steps to the toughest hikes — Mountain Maps brings together topographic maps of all Europe, GPS navigation and an AI-powered guide in a single hiking app.A lake, a mountain hut, a summit? Say where you want to go and instantly find the right trail for you.——————NEW: MIA, YOUR AI GUIDE, IS NOW EVEN BETTER——————Describe the hike you have in mind and watch it appear on the map. Today MIA, the AI guide in Mountain Maps, understands requests like these too:⇢ Create a hike that takes me to Rifugio Locatelli.⇢ Take me to a mountain hut in under 3 hours, starting from Madonna di Campiglio.⇢ Find a circular hike in Val Fiscalina with no more than 700 m of elevation gain.You tell the adventure, MIA draws it on the map.——————WHAT YOU CAN DO WITH MOUNTAIN MAPS——————Can I choose a destination and have the trail suggested to me?Yes. You point to the place you want to reach — a lake, a mountain hut, a summit — and Mountain Maps instantly suggests the best route to get there.Can I know if there's anything unexpected along the trail?Yes, in real time. With the Trail Hazards feature you see reports left by other hikers: obstacles, landslides, exposed sections, closed trails. And when you come across something, a few taps are all it takes to warn whoever walks after you.Can I plan a hike or trek from A to B?Yes. You create a complete itinerary with:• Start and end points• Waypoints along the way• \"Avoid via ferratas\" filter• Analysis of elevation gain, gradient and terrain typeCan I find new hikes suited to my level?Yes. You're not limited to routes already created by others: MIA, the AI guide, creates a personalised itinerary for you, matched to your pace and your urge to explore.Does the app work without internet too?Yes, completely. You download offline maps of all Europe, navigate with no coverage and use GPS even in remote areas.And when the snow season arrives?Mountain Maps is with you all year round: plan routes on the ski slopes, see lifts and runs, use the \"Avoid black runs\" filter and check gradients and snow conditions. Great for ski touring and snowboarding too.——————A GPS NAVIGATOR FOR THE MOUNTAINS——————Your smartphone becomes a hiking navigator:• Real-time GPS position• Navigation along your planned route• Your routes and favourite spots always with you——————DETAILED TOPOGRAPHIC MAPS OF ALL EUROPE——————Access detailed hiking cartography with:• Contour lines• 3D terrain view• Gradient layer and snow layer• Free offline maps——————GPX FILE SUPPORT——————Got a GPX track? With Mountain Maps you import GPX files, export your routes and sync with GPS devices like Garmin.——————FREQUENTLY ASKED QUESTIONS——————Is Mountain Maps only for summer hiking?No. It's made for all seasons, thanks in part to info on snow along the route.Can I avoid sections that are too difficult?Yes. Filter out via ferratas or black runs and analyse gradients and elevation before you set off.Is it useful for people new to hiking?Yes. Clear data on gradient, terrain and reports help you choose hikes suited to your level.Can I use it as an alternative to the usual hiking apps?Yes. Mountain Maps brings together AI guide, planning, GPS navigation, terrain analysis, real-time reports and offline maps in a single hiking app.Download Mountain Maps and turn every mountain outing into an adventure to live all the way to the top."
